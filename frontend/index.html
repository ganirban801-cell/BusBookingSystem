
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Bus Booking System</title>

    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            padding: 50px 15px;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #0001;
        }

        h1 {
            color: #2563eb;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:disabled {
            background: #888;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚌 My Bus Booking System</h1>

    <p>Welcome to Our Online Bus Booking Platform!</p>

    <input
        type="number"
        id="bookingId"
        placeholder="Enter Booking ID"
    >

    <br>

    <input
        type="password"
        id="token"
        placeholder="Enter Passenger Access Token"
    >

    <br>

    <button type="button" id="orderButton" onclick="createOrder()">
        Create Payment Order
    </button>

    <br>

    <button
        type="button"
        id="payButton"
        onclick="payNow()"
        disabled
    >
        Pay Now
    </button>

    <p id="message"></p>

</div>

<script>

let cashfree = null;
let paymentSessionId = "";
let currentOrderId = "";
let accessToken = "";


// INITIALIZE CASHFREE SANDBOX

try {
    cashfree = Cashfree({
        mode: "sandbox"
    });
} catch (error) {
    console.error("Cashfree SDK Error:", error);
}


// CREATE PAYMENT ORDER

async function createOrder() {

    const bookingId =
        document.getElementById("bookingId").value;

    accessToken =
        document.getElementById("token").value.trim();

    const message =
        document.getElementById("message");

    const orderButton =
        document.getElementById("orderButton");

    const payButton =
        document.getElementById("payButton");

    if (!bookingId || !accessToken) {
        message.innerText =
            "Please enter Booking ID and Access Token";
        return;
    }

    if (!cashfree) {
        message.innerText =
            "Cashfree SDK not loaded!";
        return;
    }

    orderButton.disabled = true;
    payButton.disabled = true;

    paymentSessionId = "";
    currentOrderId = "";

    message.innerText =
        "Creating Cashfree payment order...";

    try {

        const response = await fetch(
            `http://127.0.0.1:8000/payments/create-order/${bookingId}`,
            {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${accessToken}`
                }
            }
        );

        const order = await response.json();

        console.log("Cashfree Order Response:", order);

        if (!response.ok) {
            throw new Error(
                order.detail || "Order creation failed"
            );
        }

        if (!order.payment_session_id || !order.order_id) {
            throw new Error(
                "Cashfree payment session not received"
            );
        }

        paymentSessionId =
            order.payment_session_id;

        currentOrderId =
            order.order_id;

        message.innerText =
            "Payment order ready! Now click Pay Now.";

        payButton.disabled = false;

    } catch (error) {

        console.error("Order Error:", error);

        message.innerText = error.message;

    } finally {

        orderButton.disabled = false;

    }
}


// VERIFY PAYMENT THROUGH BACKEND

async function verifyPayment() {

    const message =
        document.getElementById("message");

    const payButton =
        document.getElementById("payButton");

    message.innerText =
        "Checking payment status...";

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/payments/verify",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${accessToken}`
                },

                body: JSON.stringify({
                    order_id: currentOrderId
                })
            }
        );

        const result = await response.json();

        console.log("Payment Verification:", result);

        if (!response.ok) {
            throw new Error(
                result.detail || "Payment verification failed"
            );
        }

        message.innerText =
            "Payment Successful! Seat Confirmed.";

        payButton.disabled = true;

    } catch (error) {

        console.error("Verification Error:", error);

        message.innerText =
            error.message;

        payButton.disabled = false;

    }

}


// OPEN CASHFREE CHECKOUT

async function payNow() {

    const message =
        document.getElementById("message");

    const payButton =
        document.getElementById("payButton");

    if (!paymentSessionId || !currentOrderId) {
        message.innerText =
            "Please create payment order first.";
        return;
    }

    if (!cashfree) {
        message.innerText =
            "Cashfree SDK not loaded!";
        return;
    }

    payButton.disabled = true;

    message.innerText =
        "Opening Cashfree Payment Window...";

    try {

        const result = await cashfree.checkout({
            paymentSessionId: paymentSessionId,
            redirectTarget: "_modal"
        });

        console.log("Cashfree Checkout Result:", result);

        if (result && result.paymentDetails) {

            await verifyPayment();

        } else if (result && result.error) {

            message.innerText =
                "Payment window closed or payment error. Checking status...";

            await verifyPayment();

        } else if (result && result.redirect) {

            message.innerText =
                "Payment redirect started. Complete payment and return to the website.";

            payButton.disabled = false;

        } else {

            message.innerText =
                "Payment status not received. Please check again.";

            payButton.disabled = false;

        }

    } catch (error) {

        console.error("Cashfree Checkout Error:", error);

        message.innerText =
            "Checkout Error: " + error.message;

        payButton.disabled = false;

    }

}

</script>

</body>
</html>
